name: Build Flutter APK (Fallback Worker)

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID from Bot'
        required: true
      userId:
        description: 'User ID'
        required: true
      payload:
        description: 'Build Payload (JSON)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Project & Patch Constraints
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo '${{ github.event.inputs.payload }}' > payload.json

          ASSET_URL=$(jq -r '.zipAssetUrl // .url // empty' payload.json)

          if [ -z "$ASSET_URL" ]; then
            echo "::error::Tidak ada zipAssetUrl atau url di payload."
            exit 1
          fi

          rm -rf project project.zip
          mkdir -p project

          if [[ "$ASSET_URL" == *"api.github.com"* ]]; then
            curl -fL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -o project.zip \
              "$ASSET_URL"
          else
            curl -fL -o project.zip "$ASSET_URL"
          fi

          unzip -q project.zip -d project

          PUBSPEC=$(find project -maxdepth 5 -type f -name pubspec.yaml | head -n 1)
          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml tidak ditemukan di dalam ZIP."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$PUBSPEC")
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          # 1. Hapus pubspec.lock agar tidak mengunci versi lama dari lokal user
          rm -f "$PROJECT_ROOT/pubspec.lock"

          # 2. Patch SDK Constraint di pubspec.yaml
          python3 -c "
          import re
          pubspec_path = '$PUBSPEC'
          with open(pubspec_path, 'r') as f:
              content = f.read()
          
          # Ubah batasan SDK ke range luas
          new_content = re.sub(r'sdk:\s*[\"'].*?[\"']|sdk:\s*[^\n]+', 'sdk: \">=2.12.0 <4.0.0\"', content)
          
          with open(pubspec_path, 'w') as f:
              f.write(new_content)
          "
          echo "Updated pubspec.yaml environment:"
          grep -A 3 "environment:" "$PUBSPEC" || true

      - name: Build APK
        run: |
          set -e
          cd "$PROJECT_ROOT"
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Locate APK
        run: |
          set -e
          APK_PATH=$(find "$PROJECT_ROOT" -type f -name "app-release.apk" -path "*/flutter-apk/*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::app-release.apk tidak ditemukan setelah build."
            exit 1
          fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.jobId }}
          path: ${{ env.APK_PATH }}
